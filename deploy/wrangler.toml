name = "akamata-chat"
main = "worker/index.mjs"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

# === Workers WASM module ===
# wrangler 4.x は import 文経由で .wasm を自動バンドルする。

# === D1 (Workers バックエンド) ===
[[d1_databases]]
binding = "DB"
database_name = "akamata"
database_id = "00000000-0000-0000-0000-000000000000"

[[queues.producers]]
binding = "EVENTS"
queue = "akamata-events"

[[queues.consumers]]
queue = "akamata-events"
max_batch_size = 10
max_batch_timeout = 5

[[r2_buckets]]
binding = "FILES"
bucket_name = "akamata-files"

# The Durable Object sends validated inbound envelopes to the application
# handler through a service binding. Point this at the Worker deployment that
# contains the shared Akamata application handlers (self in this reference).
[[services]]
binding = "AKAMATA_REALTIME_HANDLER"
service = "akamata-realtime-handler"
entrypoint = "AkamataRealtimeApplication"

# === Durable Object (WebSocket ハブ + room SQLite) ===
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "AKAMATA_REALTIME"
class_name = "AkamataRealtimeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AkamataRealtimeRoom"]
