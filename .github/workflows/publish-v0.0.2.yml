name: publish-v0.0.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@7dccf5e6d09267c55f815f2db29495f30ba2ebca # v2.0.1
        with:
          version: 0.16.0
          use-cache: false
      - run: ./third_party/sqlite/fetch.sh
      - name: build
        run: zig build -Dbackend=native -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/akamata-chat-${{ matrix.target }}.tar.gz -C zig-out/bin chat
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v0.0.2
          name: Akamata v0.0.2
          body_path: docs/releases/v0.0.2.md
          draft: false
          prerelease: false
          files: dist/*.tar.gz
